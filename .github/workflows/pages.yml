# Publica la carpeta app/ en GitHub Pages cada vez que se sube un cambio.
# Requiere que en Settings -> Pages, "Source" esté en "GitHub Actions".
name: Publicar la app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # GitHub Pages sirve todo con cache-control de 10 minutos, así que un
      # celular puede seguir usando el app.js viejo un rato largo después de
      # publicar. Pegándole la versión al nombre, el navegador lo pide de nuevo
      # apenas cambia. Solo toca la copia que se publica, no el repositorio.
      - name: Versionar los assets
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s|src=\"app\.js\"|src=\"app.js?v=$V\"|g; \
                  s|src=\"config\.js\"|src=\"config.js?v=$V\"|g; \
                  s|href=\"styles\.css\"|href=\"styles.css?v=$V\"|g" app/*.html
          grep -o 'app\.js?v=[a-f0-9]*' app/index.html | head -1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
