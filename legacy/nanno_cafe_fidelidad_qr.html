<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nanno Café Fidelidad</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>body{font-family:Arial;background:#f7efe8;color:#4b3027;margin:0}.wrap{max-width:520px;margin:auto;padding:20px}.card{background:#fffaf7;border-radius:20px;padding:20px;margin:16px 0}input,button{width:100%;padding:14px;margin:5px 0;border-radius:12px;box-sizing:border-box;font-size:16px}button{border:0;background:#8d5f4e;color:white;font-weight:bold}.secondary{background:#e7cfc2;color:#4b3027}.gift{background:#b77a9a}.hidden{display:none}.cups{display:flex;gap:8px}.cup{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#eaded7}.on{background:#8d5f4e;color:white}.status{padding:12px;border-radius:12px;background:#f1e3db;margin:10px 0}.ok{background:#dcebdc}.error{background:#f7d9d5;color:#7c2d24}#qrcode{display:flex;justify-content:center;margin:18px}</style></head><body><div class="wrap"><h1>☕ Nanno Café</h1><p>Fidelidad</p><div id="qrCard" class="card hidden"><h2>QR del cliente</h2><div id="qrName"></div><div id="qrcode"></div></div><div class="card"><h2>Buscar cliente</h2><input id="search" placeholder="Nombre o teléfono"><button onclick="buscar()">Buscar</button><div id="results"></div></div><div id="clientCard" class="card hidden"><h2 id="name"></h2><div id="phone"></div><div id="cups" class="cups"></div><div id="status" class="status"></div><button onclick="sumar()">+1 café</button><button class="gift" onclick="regalo()">Usar regalo</button><button class="secondary" onclick="mostrarQR()">Ver QR</button></div><div class="card"><h2>Nuevo cliente</h2><input id="newName" placeholder="Nombre"><input id="newPhone" placeholder="Teléfono"><button onclick="crear()">Crear cliente</button><div id="newStatus"></div></div></div><script>
const URL="https://unprmvlrgqwvoyvfrtsp.supabase.co",KEY="sb_publishable_AFFy3sa16bVi8dLM5MKg3g_JIIcdmeb",db=supabase.createClient(URL,KEY);let c=null;
function pintar(n){cups.innerHTML="";for(let i=1;i<=4;i++)cups.innerHTML+=`<div class="cup ${i<=n?"on":""}">☕</div>`;status.className=n>=4?"status ok":"status";status.textContent=n>=4?"🎁 ¡Café gratis disponible!":`${n} de 4 cafés acumulados. Faltan ${4-n}.`}
function seleccionar(x){c=x;clientCard.classList.remove("hidden");name.textContent=x.name;phone.textContent=x.phone||"";pintar(x.coffees||0);mostrarQR()}
async function buscar(){let q=search.value.trim();let r=await db.from("clients").select("id,name,phone,coffees").or(`name.ilike.%${q}%,phone.ilike.%${q}%`).limit(10);results.innerHTML="";if(r.error){results.innerHTML=`<div class="status error">${r.error.message}</div>`;return}r.data.forEach(x=>{let b=document.createElement("button");b.className="secondary";b.textContent=x.name+" · "+(x.phone||"");b.onclick=()=>seleccionar(x);results.appendChild(b)})}
async function cargar(id){let r=await db.from("clients").select("id,name,phone,coffees").eq("id",id).single();if(r.data)seleccionar(r.data)}
async function sumar(){if(!c)return;let n=c.coffees||0;if(n>=4)return;let r=await db.from("clients").update({coffees:n+1}).eq("id",c.id);if(r.error)return alert(r.error.message);c.coffees=n+1;pintar(c.coffees)}
async function regalo(){if(!c||c.coffees<4)return;let r=await db.from("clients").update({coffees:0}).eq("id",c.id);if(r.error)return alert(r.error.message);c.coffees=0;pintar(0)}
async function crear(){let r=await db.from("clients").insert({name:newName.value.trim(),phone:newPhone.value.trim(),coffees:0}).select("id,name,phone,coffees").single();if(r.error){newStatus.className="status error";newStatus.textContent=r.error.message;return}newStatus.className="status ok";newStatus.textContent="Cliente creado correctamente.";seleccionar(r.data)}
function mostrarQR(){if(!c)return;qrCard.classList.remove("hidden");qrName.textContent=c.name;qrcode.innerHTML="";new QRCode(qrcode,{text:location.origin+location.pathname+"?client="+c.id,width:210,height:210})}
let id=new URLSearchParams(location.search).get("client");if(id)cargar(id);
</script></body></html>
