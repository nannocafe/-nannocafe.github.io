<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nanno Café · Fidelidad</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f7efe8;color:#4b3027;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:20px}.brand{text-align:center;margin:10px 0 24px}.card{background:#fffaf7;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 5px 18px #4b302711}input,button{width:100%;padding:14px;margin:5px 0;border-radius:12px;font-size:16px;box-sizing:border-box}input{border:1px solid #ddc9bd}button{border:0;background:#8d5f4e;color:white;font-weight:bold}.secondary{background:#e7cfc2;color:#4b3027}.gift{background:#b77a9a}.hidden{display:none}.cups{display:flex;gap:8px;margin:16px 0}.cup{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#eaded7}.on{background:#8d5f4e;color:white}.status{padding:12px;border-radius:12px;background:#f1e3db;margin:10px 0}.ok{background:#dcebdc}.error{background:#f7d9d5;color:#7c2d24}.row{display:flex;gap:8px}.row button{flex:1}</style></head><body><div class="wrap"><div class="brand"><h1>☕ Nanno Café</h1><p>Fidelidad</p></div><div class="card"><h2>Buscar cliente</h2><input id="search" placeholder="Nombre o teléfono"><button onclick="buscar()">Buscar</button><div id="results"></div></div><div id="clientCard" class="card hidden"><h2 id="clientName"></h2><div id="clientPhone"></div><div id="cups" class="cups"></div><div id="status" class="status"></div><div class="row"><button onclick="sumarCafe()">+1 café</button><button class="gift" onclick="usarRegalo()">Usar regalo</button></div><button class="secondary" onclick="nuevoCliente()">Cerrar</button></div><div class="card"><h2>Nuevo cliente</h2><input id="newName" placeholder="Nombre"><input id="newPhone" placeholder="Teléfono"><button onclick="crearCliente()">Crear cliente</button><div id="newStatus"></div></div></div><script>const SUPABASE_URL="https://unprmvlrgqwvoyvfrtsp.supabase.co";const SUPABASE_KEY="sb_publishable_AFFy3sa16bVi8dLM5MKg3g_JIIcdmeb";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let cliente=null;function msg(id,t,c="status"){let e=document.getElementById(id);e.className=c;e.textContent=t}function pintar(n){let e=document.getElementById("cups");e.innerHTML="";for(let i=1;i<=4;i++){let d=document.createElement("div");d.className="cup "+(i<=n?"on":"");d.textContent="☕";e.appendChild(d)}let s=document.getElementById("status");s.className=n>=4?"status ok":"status";s.textContent=n>=4?"🎁 ¡Café gratis disponible!":n+" de 4 cafés acumulados. Faltan "+(4-n)+"."}function seleccionar(c){cliente=c;document.getElementById("clientCard").classList.remove("hidden");document.getElementById("clientName").textContent=c.name;document.getElementById("clientPhone").textContent=c.phone||"";pintar(c.coffees||0)}async function buscar(){let q=document.getElementById("search").value.trim();if(!q)return msg("results","Escribí un nombre o teléfono.","status error");let{data,error}=await db.from("clients").select("id,name,phone,coffees").or("name.ilike.%"+q+"%,phone.ilike.%"+q+"%").limit(10);if(error)return msg("results",error.message,"status error");let r=document.getElementById("results");r.innerHTML="";if(!data.length){r.innerHTML='<div class="status">No encontramos clientes.</div>';return}data.forEach(c=>{let b=document.createElement("button");b.className="secondary";b.textContent=c.name+" · "+(c.phone||"");b.onclick=()=>seleccionar(c);r.appendChild(b)})}async function sumarCafe(){if(!cliente)return;let n=cliente.coffees||0;if(n>=4)return msg("status","Primero usá el regalo disponible.","status error");n++;let{error}=await db.from("clients").update({coffees:n}).eq("id",cliente.id);if(error)return msg("status",error.message,"status error");cliente.coffees=n;pintar(n)}async function usarRegalo(){if(!cliente)return;let n=cliente.coffees||0;if(n<4)return msg("status","Todavía no tiene un café gratis.","status error");let{error}=await db.from("clients").update({coffees:0}).eq("id",cliente.id);if(error)return msg("status",error.message,"status error");cliente.coffees=0;pintar(0);msg("status","🎉 Regalo utilizado. Volvió a 0 cafés.","status ok")}async function crearCliente(){let name=document.getElementById("newName").value.trim(),phone=document.getElementById("newPhone").value.trim();if(!name)return msg("newStatus","Falta el nombre.","status error");let{data,error}=await db.from("clients").insert({name,phone,coffees:0}).select("id,name,phone,coffees").single();if(error)return msg("newStatus",error.message,"status error");msg("newStatus","Cliente creado correctamente.","status ok");document.getElementById("newName").value="";document.getElementById("newPhone").value="";seleccionar(data)}function nuevoCliente(){cliente=null;document.getElementById("clientCard").classList.add("hidden")}</script></body></html>
